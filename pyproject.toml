[project]
name = "finance-kg"
version = "0.1.0"
description = "Finance knowledge graph built on Samyama"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    # 1.10.0 ships no wheel for macOS x86_64 and its source build fails here.
    "samyama>=0.6.0,<1.10",
    "requests>=2.31",
    "rich>=13.0",
    "click>=8.0",
    "fastmcp>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["etl*", "mcp_server*", "benchmarks*", "demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
